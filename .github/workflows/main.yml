name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  ci:
    uses: JoShMiQueL/gh-actions/.github/workflows/ci.yml@main
    with:
      bun-version: "1.4.0"
      install-command: bun install --frozen-lockfile
      verify-commands: |
        npm run typecheck
        npm run build
      test-command: bun test

  pr-title:
    if: github.event_name == 'pull_request'
    uses: JoShMiQueL/gh-actions/.github/workflows/pr-title.yml@main

  release:
    uses: JoShMiQueL/gh-actions/.github/workflows/release.yml@main
    with:
      release-please: true
      contributors: false

  npm-publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    uses: JoShMiQueL/gh-actions/.github/workflows/npm-publish.yml@main
    with:
      bun-version: "1.4.0"
      install-command: bun install --frozen-lockfile
      verify-commands: |
        npm run typecheck
        npm run build
      test-command: bun test
