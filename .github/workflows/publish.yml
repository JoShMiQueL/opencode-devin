name: Publish

on:
  push:
    tags: ["v*"]

# Never cancel a publish that is already in flight; two of them would race for
# the same version.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Fails in seconds, before spending anything on the matrix, if the tag and the
  # manifest disagree. Without it a mistyped tag silently publishes the previous
  # version, or skips as "already published" and looks like it worked.
  verify-tag:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match the version in package.json
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "publishing $VERSION"

  # The plugin branches on process.platform and spawns a browser per platform
  # (rundll32 on Windows, open on macOS), and the tests bind a real loopback
  # listener, so all three platforms are gated before anything ships.
  test:
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

  publish:
    needs: [verify-tag, test]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Upgrade npm (trusted publishing requires OIDC support, npm >= 11.5)
        run: npm install -g npm@latest

      # `bun test` already ran on ubuntu-26.04 in the matrix above.
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build

      - name: Check if version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (trusted publishing)
        if: steps.check.outputs.published != 'true'
        run: npm publish --provenance
